<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h2>Welcome, {{ request.user.username }}!</h2>

    <h3>Other Users:</h3>
    <ul>
        {% for user in users %}
            <li>
                <a href="{% url 'chat_room' user.username %}">
                    {{ user.username }}
                </a>
            </li>
        {% empty %}
            <li>No other users are available.</li>
        {% endfor %}
    </ul>

    <p><a href="{% url 'logout' %}">Logout</a></p>
</body>
</html>
